:root { --accent:#d70e0f; --dark:#050506; --dark2:#121214; --S:18px; --g:5px; --H:97px; --rh:46px; --st:calc((var(--rh) + var(--g)) * .265); }
* { box-sizing:border-box; margin:0; }
html, body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:'Exo 2',system-ui,sans-serif; font-weight:900; color:#fff; }
#stage { position:absolute; left:0; top:0; width:1920px; height:1080px; }
#bugpos { position:absolute; left:48px; top:44px; }
#bug { position:relative; transform:translateX(-140%); opacity:0; transition:transform .9s cubic-bezier(.16,1,.3,1), opacity .5s; }
#bug.show { transform:none; opacity:1; }

.bar { position:relative; display:flex; height:var(--H); }
.rows { display:flex; flex-direction:column; gap:var(--g); }
.row { display:flex; height:var(--rh); }
.row .sg { --h:var(--rh); }
.row.r1 { margin-left:var(--st); }
.sg { position:relative; flex:none; height:var(--h,var(--H)); --S:calc(var(--h,var(--H)) * .265); display:flex; align-items:center; justify-content:center; text-align:center; background:var(--bg,var(--dark)); color:#fff; white-space:nowrap;
  margin-left:calc(var(--g) - var(--S)); clip-path:polygon(var(--S) 0,100% 0,calc(100% - var(--S)) 100%,0 100%); }
.sg:first-child { margin-left:0; }
.sg::before { content:''; position:absolute; inset:0; pointer-events:none; background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(0,0,0,.2)); }
.sg > * { position:relative; }
.sg img { max-height:calc(var(--h,var(--H)) - 10px); max-width:calc(100% - 26px); object-fit:contain; filter:drop-shadow(0 2px 5px rgba(0,0,0,.6)); }
.sg .lt { font-size:20px; }

.logo { width:66px; background:var(--dark); }
.abbr { width:98px; font-size:30px; letter-spacing:1px; background:var(--tc,#444); }
.score { width:68px; background:var(--dark2); font-size:36px; overflow:hidden; }
.score span { display:inline-block; }
.score.pulse span { animation:pop .9s cubic-bezier(.2,1.6,.3,1); }
.score.pulse::after { content:''; position:absolute; inset:0; background:#fff; animation:flash .9s ease-out forwards; }
@keyframes pop { 0% { transform:scale(.4); opacity:0; } 50% { transform:scale(1.35); opacity:1; } 100% { transform:scale(1); } }
@keyframes flash { from { opacity:.85; } to { opacity:0; } }
.sogcol { width:0; padding:0; margin-left:0; opacity:0; overflow:hidden; background:var(--dark2); transition:width .55s cubic-bezier(.22,1,.36,1), margin-left .55s cubic-bezier(.22,1,.36,1), opacity .4s; }
.sogcol.show { width:92px; margin-left:calc(var(--g) - var(--S)); opacity:1; }
.sogcol .lbl { position:absolute; left:calc(var(--S) * .5); right:calc(var(--S) * .5); top:50%; transform:translateY(-50%); text-align:center; font-size:10px; letter-spacing:3px; padding-left:3px; color:rgba(255,255,255,.7); z-index:1; }
.sogcol .nums { position:absolute; left:calc(var(--S) * .5); right:calc(var(--S) * .5); top:0; bottom:0; display:flex; flex-direction:column; gap:var(--g); }
.sogcol .nums b { height:var(--rh); display:flex; align-items:center; justify-content:center; font-size:26px; line-height:1; font-variant-numeric:tabular-nums; }
.clock { width:196px; background:var(--accent); flex-direction:column; gap:0; line-height:1; }
.clock .t { font-size:46px; letter-spacing:1px; font-variant-numeric:tabular-nums; margin-top:3px; }
.clock .p { font-size:16px; letter-spacing:5px; margin-top:4px; }
.clock.red .t { color:#ffe0e0; }
.clock.only .t { font-size:34px; letter-spacing:4px; margin:0; } .clock.only .p { display:none; }
.team-glow .abbr { filter:brightness(1.35); }

/* hanging tabs under the bar */
.tab { position:absolute; top:calc(var(--H) + var(--g)); height:38px; --h:38px; --S:calc(38px * .265); display:flex; align-items:center; justify-content:center; gap:9px; padding:0 calc(var(--S) + 6px); white-space:nowrap; font-size:15px; letter-spacing:1px;
  background:var(--bg,var(--dark2)); clip-path:polygon(var(--S) 0,100% 0,calc(100% - var(--S)) 100%,0 100%); opacity:0; transform:translateY(-100%); transition:transform .5s cubic-bezier(.22,1,.36,1), opacity .4s; pointer-events:none; z-index:-1; }
.tab::before { content:''; position:absolute; inset:0; background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(0,0,0,.2)); }
.tab > * { position:relative; }
.tab.show { opacity:1; transform:none; }
.tab small { font-size:11px; letter-spacing:1.5px; opacity:.85; }
.tab .tm { font-variant-numeric:tabular-nums; font-size:19px; }
.tab.pp { --bg:var(--accent); }

/* goal banner: covers the whole bug */
#goal { position:absolute; left:0; top:0; z-index:5; pointer-events:none; }
#bug.goal-on .tab { opacity:0 !important; }
#bug.goal-hide .bar { visibility:hidden; }
.gl { display:flex; height:var(--H); position:relative; }
.gl .sg { animation:segIn .6s cubic-bezier(.16,1,.3,1) calc(var(--d,0) * 1s) both; }
.gl.out .sg { animation:segOut .4s cubic-bezier(.6,0,.9,.4) calc(var(--o,0) * 1s) forwards; }
@keyframes segIn { 0% { opacity:0; transform:translateX(-150px) skewX(-14deg); filter:blur(9px) brightness(2.4); } 55% { filter:blur(0) brightness(1.7); } 100% { opacity:1; transform:none; filter:none; } }
@keyframes segOut { to { opacity:0; transform:translateX(-100px); filter:blur(5px); } }
.gflash { position:absolute; left:-60px; top:-50px; right:-60px; bottom:-50px; pointer-events:none; mix-blend-mode:screen; background:radial-gradient(ellipse at 35% 50%, var(--tc) 0%, transparent 68%); opacity:0; animation:gfl 1.3s ease-out forwards; }
@keyframes gfl { 0% { opacity:0; transform:scale(.6); } 18% { opacity:.95; } 100% { opacity:0; transform:scale(1.25); } }
.gl .sc .hit { display:inline-block; color:#fff; text-shadow:0 0 14px var(--tc2,#fff), 0 0 4px var(--tc); animation:hit .8s .55s cubic-bezier(.2,1.8,.3,1) both; }
@keyframes hit { 0% { transform:scale(.3); opacity:0; } 100% { transform:scale(1); opacity:1; } }
.gl .panel::before { animation:none; }
.gl .sg { --h:var(--H); }
.gl .plate { width:128px; background:var(--dark); }
.gl .plate img { max-height:80px; max-width:96px; animation:logoIn .7s .2s cubic-bezier(.2,1.5,.3,1) both; }
@keyframes logoIn { from { opacity:0; transform:scale(.3) rotate(-14deg); } to { opacity:1; transform:none; } }
.gl .panel { text-align:left; min-width:0; overflow:hidden; background:var(--tc); padding:0 30px 0 30px; justify-content:center; flex-direction:column; align-items:flex-start; line-height:1; }
.gl .panel::after { content:''; position:absolute; left:0; right:0; bottom:0; height:6px; background:var(--tc2,#fff); }
.gl .gk { font-size:11px; letter-spacing:5px; opacity:0; animation:up .5s .3s ease-out forwards; }
.gl .gbig { font-size:48px; letter-spacing:4px; display:flex; margin:3px 0 4px; text-shadow:0 0 18px rgba(255,255,255,.35); }
.gl .gbig span { display:inline-block; opacity:0; animation:letter .55s cubic-bezier(.2,1.8,.3,1) forwards; animation-delay:calc(.3s + var(--i) * .07s); }
.gl .gs { font-size:14px; letter-spacing:1.5px; opacity:0; animation:up .5s .75s ease-out forwards; white-space:nowrap; }
.gl .gs small { font-size:11px; letter-spacing:1.5px; opacity:.85; font-weight:800; margin-left:8px; }
.gl .shine { position:absolute; top:0; bottom:0; width:160px; left:0; background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent); transform:translateX(-300px) skewX(-18deg); animation:shine 1s .4s ease-out forwards; }
.gl .sc { width:215px; background:var(--dark2); font-size:22px; letter-spacing:1px; padding:0 30px; }
@keyframes shine { to { transform:translateX(1400px) skewX(-18deg); } }
@keyframes letter { 0% { opacity:0; transform:translateY(40px) scale(1.8) rotate(-6deg); filter:blur(8px); } 100% { opacity:1; transform:none; filter:blur(0); } }
@keyframes up { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }

/* =====================================================================
   MINIMAL / ROUNDED-PILL THEME (matches the football bug)
   ===================================================================== */
:root { --H:94px; --rh:44px; --S:0px; --g:6px; --R:12px; --dark:#0a0a0c; --dark2:#111114; --accent:#d70e0f; --st:0px; }
#bug { transform:translateX(-30px); transition:transform .7s cubic-bezier(.22,1,.36,1), opacity .5s ease; }
#bug.show { transform:none; }
.sg { --S:0px !important; clip-path:inset(0 round var(--R)); margin-left:var(--g); font-weight:800; background:var(--bg,var(--dark)); }
.sg:first-child { margin-left:0; }
.sg::before { background:none; }
.sg img { filter:none; max-height:calc(var(--h,var(--H)) - 14px); max-width:calc(100% - 18px); }
.row.r1 { margin-left:0; }
.logo { width:62px; background:var(--dark); }
.sg .lt { font-size:17px; }
.abbr { width:104px; background:var(--dark); justify-content:flex-start; padding-left:28px; font-size:26px; letter-spacing:1.5px; }
.abbr::before { content:''; position:absolute; left:11px; top:22%; bottom:22%; width:5px; border-radius:3px; background:var(--tc,#444); inset:22% auto 22% 11px; }
.score { width:60px; background:var(--dark2); font-size:32px; }
@keyframes pop { 0% { transform:scale(.7); opacity:0; } 100% { transform:scale(1); opacity:1; } }
.score.pulse span { animation:pop .45s cubic-bezier(.22,1,.36,1); }
.score.pulse::after { background:var(--accent); animation-duration:.7s; }
.sogcol { background:var(--dark2); }
.sogcol.show { width:62px; margin-left:var(--g); }
.sogcol .lbl { left:0; right:0; font-size:9px; color:rgba(255,255,255,.6); }
.sogcol .nums { left:0; right:0; }
.sogcol .nums b { font-size:22px; font-weight:800; }
.clock { width:168px; background:var(--accent); }
.clock .t { font-size:42px; font-weight:800; margin-top:2px; }
.clock .p { font-size:14px; letter-spacing:5px; margin-top:3px; font-weight:700; padding-left:5px; }
.clock.only .t { font-size:30px; }
.tab { z-index:0 !important; --S:0px !important; height:34px; --h:34px; padding:0 18px; font-size:14px; clip-path:inset(0 round 10px); transform:translateY(-8px); transition:transform .45s cubic-bezier(.22,1,.36,1), opacity .35s; }
.tab::before { background:none; }
.tab .tm { font-size:17px; font-weight:800; }
.tab.show { transform:none; }
/* goal banner */
#bug.goal-hide .bar { visibility:hidden; }
@keyframes segIn { 0% { opacity:0; transform:translateX(-26px); filter:none; } 100% { opacity:1; transform:none; filter:none; } }
@keyframes segOut { to { opacity:0; transform:translateX(-18px); filter:none; } }
.gflash { display:none; }
.gl .sg { animation-duration:.5s; }
.gl .plate { width:96px; }
.gl .plate img { max-height:66px; max-width:70px; animation:logoMin .5s .15s ease-out both; }
@keyframes logoMin { from { opacity:0; transform:scale(.85); } to { opacity:1; transform:none; } }
.gl .panel { padding:0 26px; }
.gl .panel { padding-bottom:9px; }
.gl .panel::after { height:3px; left:20px; right:20px; bottom:6px; border-radius:2px; }
.gl .shine { display:none; }
.gl .gk { font-size:11px; letter-spacing:4px; font-weight:700; }
.gl .gbig { font-size:40px; letter-spacing:5px; text-shadow:none; margin:2px 0 3px; }
@keyframes letter { 0% { opacity:0; transform:translateY(12px); filter:none; } 100% { opacity:1; transform:none; filter:none; } }
.gl .gbig span { animation-duration:.4s; animation-delay:calc(.25s + var(--i) * .06s); }
.gl .gs { font-size:13px; }
.gl .gs small { font-size:10.5px; }
.gl .sc { width:190px; font-size:21px; padding:0 20px; }
.gl .sc .hit { text-shadow:none; animation:hitMin .5s .5s cubic-bezier(.22,1,.36,1) both; }
@keyframes hitMin { from { opacity:0; transform:scale(.7); } to { opacity:1; transform:none; } }

/* ---------- NEW GOAL BANNER ---------- */
.gb { display:flex; height:var(--H); position:relative; }
.gb .sg { --h:var(--H); animation:segIn .5s cubic-bezier(.22,1,.36,1) calc(var(--d,0) * 1s) both; }
.gb .plate { width:112px; background:var(--dark); }
.gb .plate img { max-height:70px; max-width:84px; animation:logoMin .5s .15s ease-out both; }
.gb .plate .lt { font-size:28px; }
.gb .word { flex:1; background:var(--tc); color:var(--tx,#fff); font-size:62px; letter-spacing:14px; padding-left:14px; font-weight:800; }
.gb .word span { display:inline-block; animation:letter .45s cubic-bezier(.22,1,.36,1) both; animation-delay:calc(.2s + var(--i) * .07s); }
.gb.out .sg { animation:segOut .5s cubic-bezier(.4,0,1,1) calc(var(--o,0) * 1s) forwards; }
/* ---------- POPDOWN ---------- */
#pop { position:absolute; left:48px; top:144px; min-width:300px; max-width:760px; background:var(--dark); border-radius:var(--R); padding:12px 20px 14px 24px; opacity:0; transform:translateY(-12px); clip-path:inset(0 0 100% 0 round var(--R)); transition:clip-path .55s cubic-bezier(.22,1,.36,1), transform .55s cubic-bezier(.22,1,.36,1), opacity .35s, top .4s; z-index:4; pointer-events:none; }
#pop.show { opacity:1; transform:none; clip-path:inset(0 round var(--R)); }
#pop { background:var(--pbg,var(--dark)); color:var(--ptx,#fff); }
#pop::before { content:''; position:absolute; left:10px; top:14px; bottom:14px; width:5px; border-radius:3px; background:var(--pbar,var(--accent)); }
#pop .pt { font-size:13px; letter-spacing:4px; color:var(--pbar,var(--accent)); font-weight:800; text-transform:uppercase; margin-bottom:4px; filter:brightness(1.25); }
#pop .pl { font-size:21px; font-weight:700; line-height:1.3; white-space:nowrap; }
/* ---------- LOWER THIRD ---------- */
#lower { position:absolute; left:48px; bottom:60px; display:flex; height:84px; gap:var(--g); z-index:4; pointer-events:none; opacity:0; transform:translateX(-40px); transition:transform .7s cubic-bezier(.22,1,.36,1), opacity .45s; }
#lower.show { opacity:1; transform:none; }
#lower > div { position:relative; height:84px; display:flex; align-items:center; justify-content:center; background:var(--dark); border-radius:var(--R); white-space:nowrap; font-weight:800; }
#lower .lg { width:100px; background:var(--tc,#444); }
#lower .lg img { max-height:62px; max-width:76px; }
#lower .lg .lt { font-size:26px; }
#lower .ln { padding:0 26px 0 30px; font-size:34px; letter-spacing:2px; }
#lower .ln::before { content:''; position:absolute; left:11px; top:22%; bottom:22%; width:5px; border-radius:3px; background:var(--tc,#444); }
#lower .ls { flex-direction:column; padding:0 24px; min-width:120px; background:var(--dark2); }
#lower .ls small { font-size:14px; letter-spacing:3px; color:rgba(255,255,255,.65); font-weight:700; text-transform:uppercase; }
#lower .ls b { text-transform:uppercase; font-size:34px; line-height:1.05; font-weight:800; }
</style></head>
<body>
<div id="stage"><div id="bugpos">
  <div id="bug">
    <div class="bar" id="bar">
      <div class="rows">
        <div class="row r1"><div class="sg logo" id="a-logo"><img alt=""></div><div class="sg abbr" id="a-abbr"><span></span></div><div class="sg score" id="a-score"><span>0</span></div></div>
        <div class="row r2"><div class="sg logo" id="h-logo"><img alt=""></div><div class="sg abbr" id="h-abbr"><span></span></div><div class="sg score" id="h-score"><span>0</span></div></div>
      </div>
      <div class="sg sogcol" id="sogcol"><div class="lbl">SOG</div><div class="nums"><b id="sog-a">0</b><b id="sog-h">0</b></div></div>
      <div class="sg clock" id="clock"><div class="t" id="ctext">20:00</div><div class="p" id="ptext">1ST</div></div>
    </div>
    <div class="tab pp" id="a-pp"><b></b><span class="tm"></span></div>
    <div class="tab pp" id="h-pp"><b></b><span class="tm"></span></div>
  </div>
  <div id="goal"></div>
</div></div>
<div id="pop"><div class="pt"></div><div class="pl"></div></div>
<div id="lower"></div>
<script>
(() => {
  const $ = id => document.getElementById(id), BASE = location.origin === 'null' || location.protocol === 'file:' ? 'http://localhost:3100' : '';
  const S_PX = 18;
  let S = null, offset = 0, last = { a: null, h: null }, ppState = { away: false, home: false };
  const teamEls = { away: { logo: $('a-logo'), abbr: $('a-abbr'), score: $('a-score'), pp: $('a-pp') }, home: { logo: $('h-logo'), abbr: $('h-abbr'), score: $('h-score'), pp: $('h-pp') } };

  const clockMs = () => !S ? 0 : S.clock.running ? Math.max(0, S.clock.ms - (Date.now() + offset - S.clock.at)) : S.clock.ms;
  const fmt = (ms, tenths) => { if (ms < 60000 && tenths) return (Math.floor(ms / 100) / 10).toFixed(1); const s = Math.ceil(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const rem = secs => { const s = Math.ceil(secs); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

  function setTeam(side, d) {
    const e = teamEls[side];
    e.abbr.firstChild.textContent = d.abbr; e.abbr.style.setProperty('--tc', d.color);
    const img = e.logo.querySelector('img');
    if (d.logo) { if (img.getAttribute('src') !== d.logo) img.src = d.logo; img.style.display = ''; e.logo.querySelector('.lt') && e.logo.querySelector('.lt').remove(); }
    else { img.removeAttribute('src'); img.style.display = 'none'; if (!e.logo.querySelector('.lt')) { const s = document.createElement('span'); s.className = 'lt'; e.logo.appendChild(s); } e.logo.querySelector('.lt').textContent = d.abbr; }
    const sc = e.score.querySelector('span');
    if (String(d.score) !== sc.textContent) {
      const up = last[side] !== null && d.score > last[side];
      sc.textContent = d.score;
      if (up) { e.score.classList.remove('pulse'); void e.score.offsetWidth; e.score.classList.add('pulse'); }
    }
    last[side] = d.score;
    e.logo.style.display = d.logo ? '' : 'none';
    e.abbr.style.marginLeft = d.logo ? '' : '0';
  }

  function place() {
    const bar = $('bar'), br = bar.getBoundingClientRect().left, rel = el => el.getBoundingClientRect().left - br;
    const put = (el, left, rightBottom, sl) => { const l = left - sl; el.style.left = l + 'px'; el.style.width = Math.max(40, rightBottom - l) + 'px'; };
    const a = teamEls.away, h = teamEls.home, c = $('clock');
    const rowS = 0, tabSl = 0;
    for (const t of [a, h]) put(t.pp, h.logo.offsetWidth ? rel(h.logo) : rel(h.abbr), rel(h.score) + h.score.offsetWidth - rowS, tabSl);
  }

  function apply(s) {
    S = s;
    document.documentElement.style.setProperty('--accent', (s.theme && s.theme.accent) || '#d70e0f');
    setTeam('away', s.away); setTeam('home', s.home);
    $('bug').classList.toggle('show', !!s.visible);
    $('sog-a').textContent = s.away.sog; $('sog-h').textContent = s.home.sog;
    place(); setTimeout(place, 150); setTimeout(place, 800);
    tick(); extras();
  }

  function tick() {
    if (!S) return;
    const ms = clockMs(), secs = ms / 1000, noClock = /^(SO|FINAL)$/.test(S.period);
    const cl = $('clock');
    cl.classList.toggle('only', noClock);
    $('ctext').textContent = noClock ? S.period : fmt(ms, S.settings.tenths);
    $('ptext').textContent = S.period;
    cl.classList.toggle('red', ms < 60000 && S.clock.running);
    const act = side => S.penalties.filter(p => p.team === side && secs - p.end > 0.001);
    const aP = act('away'), hP = act('home');
    const sk = { away: 5 - Math.min(aP.length, 2), home: 5 - Math.min(hP.length, 2) };
    const setTab = (e, show, bg, label, t) => { if (show) { e.style.setProperty('--bg', bg); e.querySelector('b').textContent = label; e.querySelector('.tm').textContent = rem(t); } e.classList.toggle('show', show); };
    const even = sk.away === sk.home && sk.away < 5 && !noClock;
    for (const side of ['away', 'home']) {
      const other = side === 'away' ? 'home' : 'away', shorts = side === 'away' ? hP : aP, e = teamEls[side].pp;
      if (side === 'away' && even) { setTab(e, true, 'var(--accent)', sk.away + ' ON ' + sk.home, Math.min(...aP.concat(hP).map(p => secs - p.end))); continue; }
      const on = sk[side] > sk[other] && shorts.length > 0 && !noClock;
      setTab(e, on, S[side].color, sk[other] <= 3 ? '2-MAN ADV.' : 'POWER PLAY', on ? Math.min(...shorts.map(p => secs - p.end)) : 0);
    }
    $('sogcol').classList.toggle('show', !!S.settings.showSog && !noClock);
  }
  setInterval(tick, 100);
  window.addEventListener('resize', place);

  function goal(ev) {
    if (!S || !S.visible || !S.settings.goalAnim) return;
    const t = S[ev.team], root = $('goal');
    root.innerHTML = '';
    const lum = c => { const m = /^#?([\da-f]{2})([\da-f]{2})([\da-f]{2})$/i.exec(c || ''); if (!m) return .5; return (.2126 * parseInt(m[1], 16) + .7152 * parseInt(m[2], 16) + .0722 * parseInt(m[3], 16)) / 255; };
    const col = lum(t.color) < .1 && t.color2 ? t.color2 : t.color, tx = lum(col) > .72 ? '#0a0a0c' : '#fff';
    const esc = x => String(x).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
    const w = Math.max($('bar').offsetWidth, 460);
    const el = document.createElement('div'); el.className = 'gb'; el.style.width = w + 'px';
    el.style.setProperty('--tc', col); el.style.setProperty('--tx', tx);
    el.innerHTML = `<div class="sg plate" style="--d:0;--o:.1">${t.logo ? `<img src="${esc(t.logo)}">` : `<span class="lt">${esc(t.abbr)}</span>`}</div>`
      + `<div class="sg word" style="--d:.06;--o:0">${[...'GOAL'].map((c, i) => `<span style="--i:${i}">${c}</span>`).join('')}</div>`;
    root.appendChild(el); $('bug').classList.add('goal-on'); clearTimeout(goal.h); goal.h = setTimeout(() => $('bug').classList.add('goal-hide'), 300);
    clearTimeout(goal.t);
    goal.t = setTimeout(() => { $('bug').classList.remove('goal-hide'); el.classList.add('out'); setTimeout(() => { el.remove(); $('bug').classList.remove('goal-on'); }, 650); }, 4600);
  }

  /* popdown + lower third */
  let lowKey = '';
  function extras() {
    const pd = S.popdown || {}, lines = (pd.lines || []).filter(x => x && x.trim());
    const pt = S[pd.team], pe = $('pop');
    if (pt) { const lum = c => { const m = /^#?([\da-f]{2})([\da-f]{2})([\da-f]{2})$/i.exec(c || ''); return m ? (.2126 * parseInt(m[1], 16) + .7152 * parseInt(m[2], 16) + .0722 * parseInt(m[3], 16)) / 255 : .5; };
      const col = lum(pt.color) < .1 && pt.color2 ? pt.color2 : pt.color, tx = lum(col) > .72 ? '#0a0a0c' : '#fff';
      pe.style.setProperty('--pbg', col); pe.style.setProperty('--ptx', tx); pe.style.setProperty('--pbar', tx); }
    else ['--pbg', '--ptx', '--pbar'].forEach(v => pe.style.removeProperty(v));
    $('pop').querySelector('.pt').textContent = pd.title || ''; $('pop').querySelector('.pt').style.display = pd.title ? '' : 'none';
    $('pop').querySelector('.pl').innerHTML = lines.map(x => `<div>${String(x).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]))}</div>`).join('');
    $('pop').classList.toggle('show', !!pd.visible && (lines.length > 0 || !!pd.title));
    const anyTab = teamEls.away.pp.classList.contains('show') || teamEls.home.pp.classList.contains('show');
    $('pop').style.top = (144 + (anyTab ? 40 : 0)) + 'px';
    const lw = S.lower || {}, t = S[lw.team] || S.away, stats = (lw.stats || []).filter(x => x && (x.l || x.v));
    const key = JSON.stringify([lw.team, lw.title, stats, t.name, t.abbr, t.logo, t.color]);
    const esc = x => String(x).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
    if (key !== lowKey) {
      lowKey = key; const L = $('lower'); L.style.setProperty('--tc', t.color === '#000000' ? t.color2 : t.color);
      L.innerHTML = `<div class="lg">${t.logo ? `<img src="${esc(t.logo)}">` : `<span class="lt">${esc(t.abbr)}</span>`}</div><div class="ln">${esc((lw.title || t.name || t.abbr).toUpperCase())}</div>`
        + stats.map(x => `<div class="ls"><small>${esc(x.l || '')}</small><b>${esc(x.v || '')}</b></div>`).join('');
    }
    $('lower').classList.toggle('show', !!lw.visible);
  }
  setInterval(() => { if (S) extras(); }, 250);

  const es = new EventSource(BASE + '/events');
  es.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'state') { offset = m.now - Date.now(); apply(m.state); }
    else if (m.type === 'event' && m.kind === 'goal') goal(m);
  };
})();
</script>
</body></html>
